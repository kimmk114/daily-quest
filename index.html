<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루 퀘스트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>하루 퀘스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — points header, week strip, quest card, tabbed lists, floating add button */
:root {
  --bg: #121517;
  --surface: #1c2023;
  --surface-2: #252a2e;
  --line: #2f363b;
  --fg: #eef2ef;
  --muted: #8d9893;
  --accent: #5fd38d;
  --accent-ink: #0d2416;
  --gold: #ffcf5a;
  --danger: #ff7070;
  --font-display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 120px;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; }
.brand small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.wallet { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.brand { min-width: 0; white-space: nowrap; }
.brand small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 430px) { .wallet { gap: 4px; flex-wrap: nowrap; } .pill { padding: 7px 9px; font-size: 16px; } .brand { font-size: 22px; } }
@media (max-width: 380px) { .pill { padding: 6px 7px; gap: 4px; } .brand { font-size: 20px; } }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-family: var(--font-display); font-size: 17px;
}
.pill.points { color: var(--gold); }
.pill .coin { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); color: #4a3500; font-size: 11px; display: grid; place-items: center; font-family: var(--font-body); font-weight: 700; }
.pump { animation: pump .5s ease; }
@keyframes pump { 40% { transform: scale(1.18); } }

/* week strip */
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head .month { font-family: var(--font-display); font-size: 19px; display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 8px; }
.cal-head .month::after { content: "▾"; font-size: 13px; color: var(--muted); }
.cal-nav { display: flex; gap: 4px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 18px; }
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dayc { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px; border-radius: 14px; }
.dayc .dw { font-size: 11px; color: var(--muted); }
.dayc .dn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 16px; background: var(--surface); border: 2px solid transparent;
}
.dayc .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.dayc.today .dn { border-color: var(--muted); }
.dayc.sel .dn { background: var(--fg); color: var(--bg); }
.dayc.clear .dn { background: var(--accent); color: var(--accent-ink); }
.dayc.clear.sel .dn { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.dayc.fail .dot { background: var(--danger); }
.dayc.sun .dw { color: var(--danger); }

/* quest card */
.quest {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.quest.done { border-color: var(--accent); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface) 70%); }
.quest.failed { border-color: color-mix(in srgb, var(--danger) 60%, var(--line)); }
.quest-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.quest-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.reward { font-size: 12px; color: var(--muted); }
.reward b { color: var(--gold); font-weight: 600; }
.reward i { color: var(--danger); font-style: normal; font-weight: 600; }
.qrow { display: grid; grid-template-columns: 22px 54px 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
.qrow .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; }
.qrow.ok .ck { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.bar.over span { background: var(--danger); }
.qrow .val { color: var(--muted); min-width: 64px; text-align: right; }
.banner { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: var(--muted); }
.banner.win { color: var(--accent); font-weight: 600; }
.banner.lose { color: var(--danger); font-weight: 600; }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: 14px; padding: 4px; }
.tab { padding: 10px 0; border-radius: 10px; font-family: var(--font-display); font-size: 17px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface-2); color: var(--fg); }
.tab .cnt { font-family: var(--font-body); font-size: 12px; margin-left: 4px; color: var(--muted); }

.panel { display: flex; flex-direction: column; gap: 10px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.link { color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 2px; }

/* routine rows (inspired by grid look) */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { display: grid; grid-template-columns: 74px 1fr auto; align-items: stretch; min-height: 58px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .when { display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.row .what { display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; min-width: 0; }
.row .what .em { font-size: 20px; flex: none; }
.row .what .tx { min-width: 0; overflow-wrap: anywhere; }
.row.done .what .tx { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); }
.row .side { display: flex; align-items: center; gap: 4px; padding-right: 10px; }
.check {
  width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center;
  color: transparent; font-weight: 700; transition: background .15s, border-color .15s;
}
.row.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.del { width: 30px; height: 30px; border-radius: 8px; color: var(--danger); font-size: 16px; }
.row.todo { grid-template-columns: 1fr auto; }
.row.todo .what { padding-left: 14px; }
.readonly .check { cursor: default; }

.empty { text-align: center; color: var(--muted); padding: 28px 16px; border: 1px dashed var(--line); border-radius: 16px; font-size: 14px; }
.empty b { display: block; color: var(--fg); font-family: var(--font-display); font-weight: 400; font-size: 17px; margin-bottom: 4px; }

/* meals */
.kcal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.kcal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.kcal-top .big { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.kcal-top .big small { font-size: 15px; color: var(--muted); margin-left: 4px; }
.kcal .bar { height: 12px; }
.kcal-note { font-size: 12px; color: var(--muted); }
.kcal-note.over { color: var(--danger); }
.slot { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.slot-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.slot-h .nm { font-family: var(--font-display); font-size: 16px; display: flex; align-items: center; gap: 6px; }
.slot-h .nm .req { font-family: var(--font-body); font-size: 11px; color: var(--muted); }
.slot-h .nm .ok { color: var(--accent); font-size: 13px; }
.slot-h .sum { font-size: 13px; color: var(--muted); }
.food { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.food .fn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.food .fk { color: var(--muted); font-size: 13px; }
.add-row { width: 100%; padding: 14px; border-radius: 16px; border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--accent); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.add-row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.slot-add { width: 100%; padding: 10px 14px; text-align: left; color: var(--accent); font-size: 13px; font-weight: 600; border-top: 1px solid var(--line); }
.quote { margin: -4px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--surface); font-size: 14px; line-height: 1.55; color: var(--fg); }
.quote .qm { font-family: Georgia, serif; color: var(--accent); font-size: 26px; font-weight: 700; line-height: 0; margin-right: 4px; vertical-align: -9px; }
.quote em { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 4px; text-align: right; }
.mealnote { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--surface); }
.mealnote p { flex: 1; margin: 0; font-size: 14px; line-height: 1.5; }
.mealnote p small { color: var(--muted); font-size: 11px; }
.mealnote .link { flex: none; }
.ai-btn { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px dashed var(--accent); color: var(--accent); font-weight: 600; font-size: 14px; }
.ai-btn:disabled { opacity: .6; }
.aibox { display: flex; flex-direction: column; gap: 6px; }
.cap { font-size: 12px; color: var(--muted); margin: 0; }
.wtext { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; line-height: 1.5; resize: vertical; }
.wacts { display: flex; gap: 8px; align-items: stretch; }
.wreport { white-space: pre-wrap; font-size: 14px; line-height: 1.65; }
.frow3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.savemine { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.mydel { color: var(--danger, #e5534b); text-decoration: underline; cursor: pointer; }
.slot-acts { display: flex; border-top: 1px solid var(--line); }
.slot-acts .slot-add { flex: 1; border-top: 0; }
.fast-btn { flex: none; margin: 6px 8px 6px 0; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); }
.fast-btn:hover { color: var(--accent); border-color: var(--accent); }
.fast-on { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 13px; color: var(--accent); border-top: 1px solid var(--line); }
.slot.fasted { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

/* FAB */
.fab {
  position: fixed; z-index: 20;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  font-size: 32px; line-height: 1; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.45);
}
.fab[hidden] { display: none !important; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow: auto;
  background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: up .22s ease;
}
.sheet-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 4px; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
  color: var(--fg); font: inherit; font-size: 16px;
}
.frow { display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip {
  padding: 8px 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 13px;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip span { color: var(--muted); margin-left: 4px; }
.primary { width: 100%; padding: 14px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; }
.ghost { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--line); color: var(--muted); }
.ghost.danger { color: var(--danger); }
.src { font-size: 11px; color: var(--accent); margin-left: 4px; }
.results { display: flex; flex-direction: column; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.results .hint { margin: 0; padding: 14px; font-size: 13px; color: var(--muted); }
.res { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; text-align: left; border-top: 1px solid var(--line); }
.res:first-child { border-top: 0; }
.res:hover { background: var(--surface-2); }
.res .rn { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.res .rn em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 6px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }
.res .rk { flex: none; text-align: right; font-weight: 600; font-size: 14px; color: var(--accent); }
.res .rk small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.picked { border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--accent) 7%, var(--bg)); }
.pk-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pk-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.pk-per { font-size: 12px; color: var(--muted); }
.pk-kcal { font-family: var(--font-display); font-size: 26px; color: var(--accent); line-height: 1.1; }
.manual summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 0; }
.manual[open] summary { margin-bottom: 10px; }
.nutline { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.nutline i { font-style: normal; color: var(--muted); font-size: 12px; }
.nutcard { display: flex; flex-direction: column; gap: 8px; }
.nb { display: grid; grid-template-columns: 56px 1fr 70px 40px; gap: 8px; align-items: center; font-size: 13px; }
.nb b { text-align: right; font-weight: 600; }
.nb b small { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 1px; }
.nb em { font-style: normal; text-align: right; color: var(--muted); font-size: 12px; }
.nutmini { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.amt { display: flex; align-items: center; gap: 8px; }
.amt input { flex: 1; min-width: 0; }
.amt span { color: var(--muted); }
.err { color: var(--danger); font-size: 13px; min-height: 1em; }

/* month calendar */
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.mgrid .wh { font-size: 11px; color: var(--muted); padding: 4px 0; }
.mcell { aspect-ratio: 1; max-width: 100%; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--font-display); font-size: 15px; background: var(--bg); }
.mcell.out { visibility: hidden; }
.mcell.clear { background: var(--accent); color: var(--accent-ink); }
.mcell.fail { background: color-mix(in srgb, var(--danger) 22%, var(--bg)); color: var(--danger); }
.mcell.today { outline: 2px solid var(--muted); outline-offset: -2px; }
.mcell small { font-family: var(--font-body); font-size: 9px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.hist { display: flex; flex-direction: column; }
.hist div { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist .p { color: var(--accent); font-weight: 600; }
.hist .m { color: var(--danger); font-weight: 600; }
.rules { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 12px; padding: 12px 14px; line-height: 1.7; }
.rules b { color: var(--fg); }

.st { display: flex; flex-direction: column; gap: 12px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--bg); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile span { font-size: 12px; color: var(--muted); }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.15; }
.tile b small { font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-left: 3px; }
.tile em { font-style: normal; font-size: 11px; color: var(--muted); }
.card { background: var(--bg); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.card h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.cap { margin: 0; font-size: 12px; color: var(--muted); min-height: 1.4em; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 9px; font-family: var(--font-body); }
.chart .b { fill: var(--accent); }
.chart .b.over { fill: var(--danger); }
.chart .goal { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .goal-t { fill: var(--gold); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit.on { fill: color-mix(in srgb, var(--fg) 7%, transparent); }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hb { display: grid; grid-template-columns: 40px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; }
.hb.wide { grid-template-columns: minmax(0, 1.3fr) 1fr 40px; }
.hb > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb b { text-align: right; font-weight: 600; }
.rank { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.rank li { padding-left: 4px; }
.rank li::marker { color: var(--muted); font-size: 12px; }
.rank li { display: list-item; }
.rank li > span.num { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }
.rank .fn small { color: var(--muted); font-size: 11px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center; animation: up .2s ease;
}
.sync { font-size: 11px; color: var(--muted); text-align: center; }
canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .row { grid-template-columns: 62px 1fr auto; } .qrow { grid-template-columns: 22px 46px 1fr auto; } }

<div class="app" id="app">
  <header class="top">
    <div class="brand">하루 퀘스트<small id="greet">오늘도 한 칸씩</small></div>
    <div class="wallet">
      <button class="pill" id="setBtn" aria-label="설정">⚙️</button>
      <button class="pill" id="statsBtn" aria-label="통계">📊</button>
      <button class="pill" id="streakBtn" aria-label="연속 클리어">🔥 <span class="num" id="streak">0</span></button>
      <button class="pill points" id="pointsBtn" aria-label="포인트 내역"><span class="coin">P</span><span class="num" id="points">0</span></button>
    </div>
  </header>
  <p class="quote" id="quote"></p>

  <section aria-label="캘린더">
    <div class="cal-head">
      <button class="month" id="monthBtn"></button>
      <div class="cal-nav">
        <button class="icon-btn" id="prevW" aria-label="이전 주">‹</button>
        <button class="icon-btn" id="todayBtn" aria-label="오늘로" style="font-size:13px;width:auto;padding:0 10px">오늘</button>
        <button class="icon-btn" id="nextW" aria-label="다음 주">›</button>
      </div>
    </div>

  </section>

  <section class="quest" id="quest"></section>

  <div class="tabs" role="tablist">

    <button class="tab" role="tab" data-tab="todo" id="tab-todo">투두<span class="cnt" id="c-todo"></span></button>
    <button class="tab" role="tab" data-tab="meal" id="tab-meal">식단<span class="cnt" id="c-meal"></span></button>
    <button class="tab" role="tab" data-tab="workout" id="tab-workout">운동<span class="cnt" id="c-workout"></span></button>

</div>

<button class="fab" id="fab" aria-label="추가">+</button>

<canvas id="fx" hidden></canvas>

<script>
(() => {
  const KEY = 'daily-quest-v1';
  const REWARD = 100, PENALTY = 50;
  const SLOTS = ['아침', '점심', '저녁'];
  const MEAL_SLOTS = ['아침', '점심', '저녁', '간식'];
  const TIMES = ['아침', '점심', '오후', '저녁', '자기 전'];
  const EMOJIS = ['💧','🧘','💊','📖','🏃','💪','🪥','🧴','🛏️','✍️','🥗','🚶','🧹','🎧','☀️','🌙'];
  const PRESETS = [
    ['밥 한 공기', 300], ['현미밥 한 공기', 280], ['계란 1개', 75], ['닭가슴살 100g', 165],
    ['바나나 1개', 90], ['사과 1개', 110], ['고구마 1개', 130], ['그릭요거트', 120],
    ['샐러드', 150], ['김치찌개', 450], ['된장찌개', 300], ['라면', 500],
    ['김밥 한 줄', 420], ['샌드위치', 380], ['아메리카노', 10], ['라떼', 190], ['우유 한 잔', 130], ['프로틴 쉐이크', 140]
  ];
  const WD = ['일','월','화','수','목','금','토'];
  const QUOTES = [
    ['천 리 길도 한 걸음부터.', '노자'],
    ['오늘 할 수 있는 일을 내일로 미루지 마라.', '벤저민 프랭클린'],
    ['우리가 반복하는 것이 곧 우리 자신이다. 탁월함은 행동이 아니라 습관이다.', '윌 듀런트'],
    ['시작이 반이다.', '아리스토텔레스'],
    ['넘어지는 것은 실패가 아니다. 넘어진 자리에 머무는 것이 실패다.', '속담'],
    ['작은 일도 무시하지 않고 최선을 다하면 정성스럽게 된다.', '중용'],
    ['성공은 매일 반복한 작은 노력들의 합이다.', '로버트 콜리어'],
    ['할 수 있다고 믿든 할 수 없다고 믿든, 당신이 옳다.', '헨리 포드'],
    ['멈추지만 않는다면 얼마나 천천히 가는지는 문제가 되지 않는다.', '공자'],
    ['가장 큰 영광은 한 번도 넘어지지 않는 것이 아니라 넘어질 때마다 일어서는 것이다.', '공자'],
    ['내일은 오늘 무엇을 하느냐에 달려 있다.', '마하트마 간디'],
    ['어제보다 나은 오늘이면 충분하다.', '하루 퀘스트'],
    ['완벽보다 꾸준함이 이긴다.', '하루 퀘스트'],
    ['몸은 당신이 하는 말을 듣는다. 오늘도 좋은 말을 들려주자.', '하루 퀘스트'],
    ['위대한 일은 충동이 아니라 작은 일들이 모여 이루어진다.', '빈센트 반 고흐'],
    ['행동이 항상 행복을 가져오지는 않지만, 행동 없이는 행복도 없다.', '벤저민 디즈레일리'],
    ['미래를 예측하는 가장 좋은 방법은 미래를 만드는 것이다.', '피터 드러커'],
    ['포기하고 싶을 때가 바로 거의 다 왔을 때다.', '속담'],
    ['물방울이 바위를 뚫는 것은 힘이 아니라 꾸준함 때문이다.', '오비디우스'],
    ['자신을 이기는 것이 가장 큰 승리다.', '플라톤'],
    ['지금 고통스러운 것은 언젠가 힘이 된다.', '오비디우스'],
    ['하루하루를 마지막 날처럼 살되, 영원히 살 것처럼 배워라.', '마하트마 간디'],
    ['산을 옮기는 사람은 작은 돌을 옮기는 것부터 시작한다.', '공자'],
    ['인생은 자전거를 타는 것과 같다. 균형을 잡으려면 계속 움직여야 한다.', '알베르트 아인슈타인'],
    ['동기는 시작하게 하고, 습관은 계속하게 한다.', '짐 론'],
    ['오늘의 나를 만든 것은 어제의 나고, 내일의 나를 만드는 것은 오늘의 나다.', '하루 퀘스트'],
    ['실패는 성공으로 가는 길에 있는 이정표다.', 'C.S. 루이스'],
    ['건강한 몸에 건강한 정신이 깃든다.', '유베날리스'],
    ['느리더라도 꾸준하면 경주에서 이긴다.', '이솝'],
    ['어려움 속에 기회가 있다.', '알베르트 아인슈타인'],
    ['쉬는 것도 훈련이다. 오늘 쉬었다면 내일 더 잘하면 된다.', '하루 퀘스트'],
    ['당신이 할 수 있는 일, 할 수 있다고 꿈꾸는 일이 있다면 지금 시작하라.', '괴테'],
    ['삶이 있는 한 희망은 있다.', '키케로'],
    ['계획 없는 목표는 소원에 불과하다.', '생텍쥐페리'],
    ['한 번에 하나씩, 오늘 할 퀘스트 하나부터.', '하루 퀘스트'],
    ['나는 천천히 가는 사람이지만 결코 뒤로 가지는 않는다.', '에이브러햄 링컨'],
    ['꿈을 이루고 싶다면 먼저 꿈에서 깨어나라.', '속담'],
    ['오늘 걷지 않으면 내일은 뛰어야 한다.', '속담'],
    ['의지가 있는 곳에 길이 있다.', '속담'],
    ['스스로를 믿어라. 당신은 생각보다 강하다.', '하루 퀘스트']
  ];
  function dailyQuote(date) {
    const d = parse(date);
    const n = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
    return QUOTES[((n * 7) % QUOTES.length + QUOTES.length) % QUOTES.length];
  }

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const today = () => ymd(new Date());

  function defaultState() {
    return {
      v: 1, points: 0, goalKcal: 2500, goalV2: true, startDate: today(), updatedAt: 0,
      routines: [
        { id: uid(), emoji: '💧', text: '일어나서 물 한 잔', time: '아침' },
        { id: uid(), emoji: '🧘', text: '스트레칭 10분', time: '아침' },
        { id: uid(), emoji: '💊', text: '영양제 챙겨 먹기', time: '점심' },
        { id: uid(), emoji: '📖', text: '독서 20분', time: '자기 전' }
      ],
      days: {}
    };
  }

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 1) S = defaultState();
  // 기존 기본값(1800)을 성인 남성 권장량(2500)으로 바꿈
  function migrate(s) { if (!s.goalV2) { if (s.goalKcal === 1800) s.goalKcal = 2500; s.goalV2 = true; } s.myFoods ||= []; return s; }
  migrate(S);

  let sel = today();
  let tab = 'routine';
  let editRoutines = false;

  const emptyDay = () => ({ todos: [], rdone: {}, meals: [], skip: {}, result: null, delta: 0 });
  const getDay = (date) => S.days[date] || emptyDay();
  const ensureDay = (date) => (S.days[date] ||= emptyDay());

  function status(date) {
    const d = getDay(date);
    const rTotal = S.routines.length;
    const rDone = S.routines.filter((r) => d.rdone[r.id]).length;
    const tTotal = d.todos.length;
    const tDone = d.todos.filter((t) => t.done).length;
    const kcal = d.meals.reduce((a, m) => a + (Number(m.kcal) || 0), 0);
    const slotsDone = SLOTS.filter((s) => (d.skip && d.skip[s]) || d.meals.some((m) => m.slot === s)).length;
    const rOK = rDone === rTotal;
    const tOK = tDone === tTotal;
    const mOK = slotsDone === SLOTS.length && kcal <= S.goalKcal;
    return { rTotal, rDone, tTotal, tDone, kcal, slotsDone, rOK, tOK, mOK, ok: rOK && tOK && mOK };
  }

  function applyDelta(n) { const before = S.points; S.points = Math.max(0, S.points + n); return S.points - before; }

  function settle() {
    const t = today();
    let changed = false;
    for (let date = S.startDate; date < t; date = addDays(date, 1)) {
      const d = getDay(date);
      if (d.result) continue;
      const st = status(date);
      const day = ensureDay(date);
      if (st.ok) { day.result = 'clear'; day.delta = applyDelta(REWARD); }
      else { day.result = 'fail'; day.delta = applyDelta(-PENALTY); }
      changed = true;
    }
    return changed;
  }

  function checkToday(date) {
    if (date !== today()) return;
    const st = status(date);
    const d = ensureDay(date);
    if (st.ok && d.result !== 'clear') {
      d.result = 'clear'; d.delta = applyDelta(REWARD);
      celebrate(); toast(`퀘스트 클리어! +${REWARD}P`); bump();
    } else if (!st.ok && d.result === 'clear') {
      applyDelta(-d.delta); d.result = null; d.delta = 0;
      toast('클리어 조건이 깨져서 포인트를 되돌렸어요'); bump();
    }
  }

  // 지난 날 식단을 고치면 그날 결과를 다시 판정
  function resettle(date) {
    if (date >= today()) return;
    const d = S.days[date];
    if (!d || !d.result) return;
    const ok = status(date).ok;
    if (ok && d.result === 'fail') {
      applyDelta(-d.delta); d.result = 'clear'; d.delta = applyDelta(REWARD);
      celebrate(); toast(`지난 퀘스트도 클리어! 실패 포인트를 돌려받고 +${REWARD}P`); bump();
    } else if (!ok && d.result === 'clear') {
      applyDelta(-d.delta); d.result = 'fail'; d.delta = applyDelta(-PENALTY);
      toast(`클리어 조건이 깨져서 그날 결과가 실패로 바뀌었어요 (−${PENALTY}P)`); bump();
    }
  }

  function streak() {
    let n = 0, date = today();
    if (getDay(date).result !== 'clear') date = addDays(date, -1);
    while (getDay(date).result === 'clear') { n++; date = addDays(date, -1); }
    return n;
  }

  /* ---------- persistence ---------- */
  let dbRef = null, saveTimer = null, saving = Promise.resolve();
  function setSync(t) { $('#sync').textContent = t; }
  function persist() {
    S.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (!dbRef) return;
      const snap = JSON.parse(JSON.stringify(S));
      saving = saving.then(() => dbRef.set(snap)).then(() => setSync('☁ 내 계정에 저장됨'))
        .catch(() => setSync('계정 저장에 실패했어요. 이 기기에는 저장돼 있어요.'));
    }, 700);
  }
  function commit(date) { if (date) { checkToday(date); resettle(date); } persist(); render(); }

  async function connect() {
    let tries = 0;
    while (!(window.claude && window.claude.use) && tries < 15) { await new Promise((r) => setTimeout(r, 200)); tries++; }
    if (!(window.claude && window.claude.use)) { setSync('이 기기(브라우저)에 저장 중'); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { setSync('로그인하면 계정에 저장돼요 · 지금은 이 기기에 저장 중'); return; }
    const ref = db.doc('data/users/' + id + '/state');
    const slow = setTimeout(() => setSync('계정 데이터를 아직 못 불러왔어요 · 이 기기 기록을 보여주는 중'), 10000);
    try {
      const snap = await ref.get();
      clearTimeout(slow);
      dbRef = ref;
      const remote = snap.exists ? snap.data() : null;
      if (remote && remote.v === 1 && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
        S = migrate(JSON.parse(JSON.stringify(remote)));
        if (settle()) persist();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        render();
        setSync('☁ 내 계정에 저장됨');
      } else {
        persist();
        setSync('☁ 내 계정에 저장됨');
      }
    } catch (e) {
      clearTimeout(slow);
      setSync('계정에 연결하지 못했어요 · 이 기기에 저장 중');
    }
  }

  /* ---------- rendering ---------- */
  function render() {
    const t = today();
    const st = status(sel);
    const d = getDay(sel);
    const isPast = sel < t, isFuture = sel > t;

    $('#points').textContent = S.points.toLocaleString();
    $('#streak').textContent = streak();
    const h = new Date().getHours();
    { const [qt, qa] = dailyQuote(t); $('#quote').innerHTML = `<span class="qm">“</span>${esc(qt)}<em>— ${esc(qa)}</em>`; }
    $('#greet').textContent = h < 11 ? '좋은 아침, 오늘도 한 칸씩' : h < 18 ? '오후도 퀘스트 진행 중' : '오늘 마무리할 시간';

    // week strip
    const sd = parse(sel);
    $('#monthBtn').textContent = `${sd.getFullYear()}년 ${sd.getMonth() + 1}월`;
    const start = addDays(sel, -sd.getDay());
    let wk = '';
    for (let i = 0; i < 7; i++) {
      const date = addDays(start, i);
      const r = getDay(date).result;
      const cls = ['dayc', date === t && 'today', date === sel && 'sel', r === 'clear' && 'clear', r === 'fail' && 'fail', i === 0 && 'sun'].filter(Boolean).join(' ');
      wk += `<button class="${cls}" data-date="${date}" aria-label="${date}"><span class="dw">${WD[i]}</span><span class="dn num">${parse(date).getDate()}</span><span class="dot"></span></button>`;
    }
    $('#week').innerHTML = wk;

    // quest card
    const q = $('#quest');
    q.className = 'quest' + (d.result === 'clear' ? ' done' : d.result === 'fail' ? ' failed' : '');
    const pct = (a, b) => (b === 0 ? 100 : Math.round((a / b) * 100));
    const kPct = Math.min(100, Math.round((st.kcal / S.goalKcal) * 100));
    const label = sel === t ? '오늘의 퀘스트' : `${sd.getMonth() + 1}월 ${sd.getDate()}일 퀘스트`;
    let banner = '';
    if (d.result === 'clear') banner = `<div class="banner win">🎉 퀘스트 클리어! +${d.delta}P 받았어요</div>`;
    else if (d.result === 'fail') banner = `<div class="banner lose">퀘스트 실패 · ${d.delta}P</div>`;
    else if (isFuture) banner = `<div class="banner">미리 할 일과 식단을 적어둘 수 있어요. 그날이 되면 퀘스트가 시작돼요.</div>`;
    q.innerHTML = `
      <div class="quest-head"><h2>${label}</h2><span class="reward">클리어 <b>+${REWARD}P</b> · 실패 <i>−${PENALTY}P</i></span></div>
      <div class="qrow ${st.rOK ? 'ok' : ''}"><span class="ck">${st.rOK ? '✓' : ''}</span><span>루틴</span><div class="bar"><span style="width:${pct(st.rDone, st.rTotal)}%"></span></div><span class="val num">${st.rDone}/${st.rTotal}</span></div>
      <div class="qrow ${st.tOK ? 'ok' : ''}"><span class="ck">${st.tOK ? '✓' : ''}</span><span>투두</span><div class="bar"><span style="width:${pct(st.tDone, st.tTotal)}%"></span></div><span class="val num">${st.tDone}/${st.tTotal}</span></div>
      <div class="qrow ${st.mOK ? 'ok' : ''}"><span class="ck">${st.mOK ? '✓' : ''}</span><span>식단</span><div class="bar ${st.kcal > S.goalKcal ? 'over' : ''}"><span style="width:${Math.max(pct(st.slotsDone, 3) * 0.999, 0)}%"></span></div><span class="val num">${st.slotsDone}/3끼</span></div>
      ${banner}`;

    // tabs
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));

  /* ---------- interactions ---------- */

    else if (act === 'delT') { const d = ensureDay(sel); d.todos = d.todos.filter((t) => t.id !== id); commit(sel); }
    else if (act === 'delM') { const d = ensureDay(sel); d.meals = d.meals.filter((m) => m.id !== id); commit(sel); }
    else if (act === 'addM') openMeal(a.dataset.slot);
    else if (act === 'skipM') { const d = ensureDay(sel); (d.skip ||= {})[a.dataset.slot] = true; commit(sel); toast(`${a.dataset.slot}은 단식으로 체크했어요`); }
    else if (act === 'unskipM') { const d = ensureDay(sel); if (d.skip) delete d.skip[a.dataset.slot]; commit(sel); }

    return `<div class="mealnote"><span>🤖</span><p id="mnote">${n ? esc(n.text) : '오늘 식단을 AI가 한 줄로 평가해줘요.'}${n && !fresh ? ' <small>(식단이 바뀌었어요)</small>' : ''}</p>${fresh ? '' : `<button class="link" id="mnoteBtn">${n ? '다시 분석' : '한 줄 분석'}</button>`}</div>`;

  async function analyzeMeals() {

      if (d.skip && d.skip[sl]) return `${sl}: 단식(걸렀음)`;

      return it.length ? `${sl}: ` + it.map((m) => `${m.name} ${m.kcal}kcal${m.nut ? ` (탄${m.nut.c ?? '?'} 단${m.nut.p ?? '?'} 지${m.nut.f ?? '?'}g)` : ''}`).join(', ') : `${sl}: 기록 없음`;
    }).join('\n');
    const { o } = sumNut(d.meals);
    try {
      const { text } = await AI(`너는 다정한 영양사야. 아래 하루 식단을 보고 한국어 한 문장(50자 안팎, 이모지 1개 가능)으로 핵심 평가와 다음 끼니 팁을 줘. 문장 하나만 답해.
목표 칼로리: ${S.goalKcal}kcal, 먹은 칼로리: ${st.kcal}kcal
영양소 합계(알려진 것만): 탄수화물 ${Math.round(o.c)}g, 단백질 ${Math.round(o.p)}g, 지방 ${Math.round(o.f)}g, 나트륨 ${Math.round(o.na)}mg
${lines}`, { modelTier: 'quick' });
      const dd = ensureDay(date); dd.mealNote = { text: text.trim().split('\n')[0].slice(0, 160), sig: mealSig(dd) };

"""${text}"""

${hist}

형식: 마크다운 기호(#, *, -) 없이, 아래 5개 제목을 이모지와 함께 쓰고 각 1~3줄, 전체 15줄 이내.

👍 잘한 점

  /* ---------- sheets ---------- */
  function openSheet(html, onMount) {

    root.querySelectorAll('[data-dismiss]').forEach((b) => (b.onclick = closeSheet));

          4. 나온 키(AQ. 또는 AIza로 시작)를 <b>키 복사</b>로 복사해서 아래에 붙여넣기<br>
          <span style="font-size:12px">카드 등록 없이 무료 사용량 안에서 써요. 무료로 쓰면 입력한 내용이 구글 서비스 개선에 쓰일 수 있어요. 키는 이 기기에만 저장돼요.</span></div>
        <div class="field"><label for="gkey">Gemini API 키 ${has ? '<span class="src">저장됨 ✓</span>' : ''}</label>
          <input id="gkey" type="password" autocomplete="off" spellcheck="false" placeholder="${has ? '새 키로 바꾸려면 붙여넣기' : 'AQ... 또는 AIza...'}"></div>
        <div class="err" id="ferr"></div>
        <p class="cap" id="gmsg"></p>
        <button class="primary">저장하고 연결 확인</button>
        ${has ? '<button type="button" class="ghost danger" id="gdel">키 지우기</button>' : ''}
        <button type="button" class="ghost" data-dismiss>닫기</button>
      </form>`, (root) => {
      const msg = root.querySelector('#gmsg'), err = root.querySelector('#ferr');
      root.querySelector('#f').onsubmit = async (e) => {
        e.preventDefault();
        const v = root.querySelector('#gkey').value.trim();
        if (v) { try { localStorage.setItem(AIKEY, v); } catch (x) { err.textContent = '이 브라우저에 저장하지 못했어요.'; return; } }
        if (!geminiKey()) { err.textContent = '키를 붙여넣어 주세요.'; return; }
        err.textContent = ''; msg.textContent = '연결 확인 중…';
        const g = geminiAI();
        try {
          await g('"연결 성공"이라고만 답해.');
          if (!CLAUDE_AI) AI = g;
          aiOff = false;
          msg.textContent = '';
          closeSheet(); render(); toast('Gemini 연결 완료! 이제 AI 기능을 쓸 수 있어요');
        } catch (x) { msg.textContent = aiErr(x) || '연결하지 못했어요.'; if (!CLAUDE_AI) AI = g; }
      };
      const del = root.querySelector('#gdel');
      if (del) del.onclick = () => { try { localStorage.removeItem(AIKEY); } catch (x) {} if (!CLAUDE_AI) AI = null; closeSheet(); render(); toast('Gemini 키를 지웠어요'); };
    });
  }

  function openGoal() {
    openSheet(`
      <h3>하루 목표 칼로리</h3>
      <form id="f" class="sheet-in" style="gap:14px">
        <div class="rules">성인 남성 하루 권장 칼로리는 약 <b>2,500kcal</b>예요 (19~29세 2,600 · 30~49세 2,500 · 50~64세 2,200 · 보건복지부 2020 한국인 영양소 섭취기준). 다이어트 중이면 여기서 300~500kcal 정도 빼서 정하는 경우가 많아요.</div>
        <div class="field"><label for="gk">kcal</label><input id="gk" type="number" inputmode="numeric" min="800" max="5000" value="${S.goalKcal}"></div>
        <div class="chips">${[2000, 2200, 2500, 2600, 2800, 3000].map((k) => `<button type="button" class="chip" data-k="${k}">${k}</button>`).join('')}</div>
        <div class="err" id="ferr"></div>
        <button class="primary">저장</button>
        <button type="button" class="ghost" data-dismiss>취소</button>
      </form>`, (root) => {
      root.querySelector('.chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) root.querySelector('#gk').value = c.dataset.k; });
      root.querySelector('#f').onsubmit = (e) => {
        e.preventDefault();
        const k = Math.round(Number(root.querySelector('#gk').value));
        if (!(k >= 800 && k <= 5000)) { root.querySelector('#ferr').textContent = '800에서 5000 사이로 적어주세요.'; return; }
        S.goalKcal = k; closeSheet(); commit(today()); toast(`목표를 ${k}kcal로 바꿨어요`);
      };
    });
  }

  function openMonth(base) {
    let y = base.getFullYear(), m = base.getMonth();
    const draw = (root) => {
      const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
      const t = today();
      let cells = WD.map((w) => `<div class="wh">${w}</div>`).join('');
      for (let i = 0; i < first.getDay(); i++) cells += `<div class="mcell out"></div>`;
      let clear = 0, fail = 0;
      for (let dd = 1; dd <= days; dd++) {
        const date = ymd(new Date(y, m, dd));
        const r = getDay(date).result;
        if (r === 'clear') clear++; if (r === 'fail') fail++;
        const kc = getDay(date).meals.reduce((a, x) => a + (Number(x.kcal) || 0), 0);
        cells += `<button class="mcell ${r || ''} ${date === t ? 'today' : ''}" data-go="${date}"><span class="num">${dd}</span>${kc ? `<small class="num">${kc}</small>` : ''}</button>`;
      }
      root.querySelector('#mtitle').textContent = `${y}년 ${m + 1}월`;
      root.querySelector('#mg').innerHTML = cells;
      root.querySelector('#msum').textContent = `클리어 ${clear}일 · 실패 ${fail}일`;
    };
    openSheet(`
      <div class="cal-head"><h3 id="mtitle"></h3><div class="cal-nav"><button class="icon-btn" id="mp" aria-label="이전 달">‹</button><button class="icon-btn" id="mn2" aria-label="다음 달">›</button></div></div>
      <div class="mgrid" id="mg"></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>클리어</span><span><i style="background:color-mix(in srgb,var(--danger) 40%,var(--bg))"></i>실패</span><span>숫자 아래 = 먹은 kcal</span><span id="msum"></span></div>
      <button class="ghost" data-dismiss>닫기</button>`, (root) => {
      draw(root);
      root.querySelector('#mp').onclick = () => { m--; if (m < 0) { m = 11; y--; } draw(root); };
      root.querySelector('#mn2').onclick = () => { m++; if (m > 11) { m = 0; y++; } draw(root); };
      root.querySelector('#mg').addEventListener('click', (e) => { const c = e.target.closest('[data-go]'); if (c) { sel = c.dataset.go; closeSheet(); render(); } });
    });
  }

  function openHistory() {
    const rows = Object.entries(S.days).filter(([, d]) => d.result).sort((a, b) => (a[0] < b[0] ? 1 : -1)).slice(0, 30);
    openSheet(`
      <h3>포인트 <span class="num" style="color:var(--gold)">${S.points.toLocaleString()}P</span></h3>
      <div class="rules"><b>규칙</b><br>· 루틴 전부 + 투두 전부 + 아침·점심·저녁 기록하고 목표 칼로리 이하 → <b>+${REWARD}P</b><br>· 하루가 지났는데 하나라도 못 하면 → <b>−${PENALTY}P</b> (0P 아래로는 안 내려가요)<br>· 🔥 숫자는 연속으로 클리어한 날이에요 · 지금 ${streak()}일</div>
      <div class="hist">${rows.length ? rows.map(([date, d]) => `<div><span>${date.slice(5).replace('-', '/')} ${d.result === 'clear' ? '클리어' : '실패'}</span><span class="${d.delta >= 0 ? 'p' : 'm'} num">${d.delta >= 0 ? '+' : ''}${d.delta}P</span></div>`).join('') : '<div><span style="color:var(--muted)">아직 내역이 없어요. 오늘 퀘스트를 깨보세요!</span></div>'}</div>
      <button class="ghost" data-dismiss>닫기</button>`);
  }

  /* ---------- stats ---------- */
  function openStats() {
    let range = 7;
    openSheet(`
      <div class="cal-head"><h3>통계</h3>${segHTML('range', ['최근 7일', '최근 30일'], '최근 7일')}</div>
      <div id="stbody" class="st"></div>
      <button class="ghost" data-dismiss>닫기</button>`, (root) => {
      wireSeg(root, 'range', (v) => { range = v === '최근 7일' ? 7 : 30; draw(); });
      const body = root.querySelector('#stbody');
      function draw() {
        const t = today();
        const dates = []; for (let i = range - 1; i >= 0; i--) dates.push(addDays(t, -i));
        const rows = dates.map((date) => {
          const d = getDay(date), st = status(date);
          return { date, d, kcal: st.kcal, logged: d.meals.length > 0, active: date >= S.startDate && date <= t, rDone: st.rDone, rTotal: st.rTotal };
        });
        const logged = rows.filter((r) => r.logged);
        const avg = logged.length ? Math.round(logged.reduce((a, r) => a + r.kcal, 0) / logged.length) : 0;
        const under = logged.filter((r) => r.kcal <= S.goalKcal).length;
        const settled = rows.filter((r) => r.d.result);
        const clear = settled.filter((r) => r.d.result === 'clear').length;
        const act = rows.filter((r) => r.active);
        const rSum = act.reduce((a, r) => a + r.rDone, 0), rTot = act.reduce((a, r) => a + r.rTotal, 0);
        const rRate = rTot ? Math.round((rSum / rTot) * 100) : 0;

        // bar chart (one series: kcal per day, goal as reference line)
        const W = 320, H = 170, L = 34, R = 6, T = 14, B = 22;
        const maxK = Math.max(S.goalKcal * 1.15, ...rows.map((r) => r.kcal));
        const step = Math.pow(10, Math.floor(Math.log10(maxK))) / 2;
        const top = Math.ceil(maxK / step) * step;
        const y = (v) => T + (H - T - B) * (1 - v / top);
        const slot = (W - L - R) / rows.length;
        const bw = Math.max(3, Math.min(26, slot - (range > 7 ? 2 : 10)));
        const ticks = [0, top / 2, top];
        let svg = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 3}" class="ax" text-anchor="end">${v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : v}</text>`).join('');
        rows.forEach((r, i) => {
          const cx = L + slot * i + slot / 2, x = cx - bw / 2;
          if (r.kcal > 0) {
            const yt = y(r.kcal), h = H - B - yt, rad = Math.min(4, bw / 2, h);
            svg += `<path class="b ${r.kcal > S.goalKcal ? 'over' : ''}" d="M${x},${H - B} V${yt + rad} Q${x},${yt} ${x + rad},${yt} H${x + bw - rad} Q${x + bw},${yt} ${x + bw},${yt + rad} V${H - B} Z"/>`;
          }
          svg += `<rect class="hit" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" data-i="${i}"/>`;
          const showLab = range === 7 || i % 5 === (rows.length - 1) % 5;
          if (showLab) { const pd = parse(r.date); svg += `<text x="${cx}" y="${H - 6}" class="ax" text-anchor="middle">${range === 7 ? WD[pd.getDay()] : pd.getMonth() + 1 + '/' + pd.getDate()}</text>`; }
        });
        svg += `<line x1="${L}" x2="${W - R}" y1="${y(S.goalKcal)}" y2="${y(S.goalKcal)}" class="goal"/><text x="${W - R}" y="${y(S.goalKcal) - 4}" class="ax goal-t" text-anchor="end">목표 ${S.goalKcal.toLocaleString()}</text>`;

        // meals by slot
        const slotAvg = MEAL_SLOTS.map((s) => {
          const tot = logged.reduce((a, r) => a + r.d.meals.filter((m) => m.slot === s).reduce((x, m) => x + (Number(m.kcal) || 0), 0), 0);
          return [s, logged.length ? Math.round(tot / logged.length) : 0];
        });
        const slotMax = Math.max(1, ...slotAvg.map((x) => x[1]));

        // foods
        const foods = {}; const singles = [];
        logged.forEach((r) => r.d.meals.forEach((m) => {
          const f = (foods[m.name] ||= { n: 0, k: 0 }); f.n++; f.k += Number(m.kcal) || 0;
          singles.push({ name: m.name, kcal: Number(m.kcal) || 0, date: r.date });
        }));
        const topFoods = Object.entries(foods).sort((a, b) => b[1].n - a[1].n || b[1].k - a[1].k).slice(0, 5);
        const heavy = singles.sort((a, b) => b.kcal - a.kcal).slice(0, 5);

        // routine rates
        const rr = S.routines.map((r) => { const n = act.filter((x) => x.d.rdone[r.id]).length; return [r, act.length ? Math.round((n / act.length) * 100) : 0, n]; });

        body.innerHTML = `
          <div class="tiles">
            <div class="tile"><span>하루 평균 섭취</span><b class="num">${avg.toLocaleString()}<small>kcal</small></b><em>기록한 ${logged.length}일 기준</em></div>
            <div class="tile"><span>목표 이하로 먹은 날</span><b class="num">${under}<small>/ ${logged.length}일</small></b><em>목표 ${S.goalKcal.toLocaleString()}kcal</em></div>
            <div class="tile"><span>퀘스트 클리어</span><b class="num">${clear}<small>/ ${settled.length}일</small></b><em>🔥 연속 ${streak()}일</em></div>
            <div class="tile"><span>루틴 달성률</span><b class="num">${rRate}<small>%</small></b><em>${rSum} / ${rTot}개 체크</em></div>
          </div>
          <section class="card">
            <h4>날짜별 섭취 칼로리</h4>
            <p class="cap" id="cap">막대를 누르면 그날 칼로리가 보여요 · 빨간 막대는 목표 초과</p>
            <svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="날짜별 섭취 칼로리 막대 그래프">${svg}</svg>
          </section>
          <section class="card">
            <h4>하루 평균 영양소</h4>
            ${logged.length ? nutCard(logged.flatMap((r) => r.d.meals), logged.length) : '<p class="cap">아직 식단 기록이 없어요.</p>'}
          </section>
          <section class="card">
            <h4>끼니별 평균 칼로리</h4>
            <div class="hbars">${slotAvg.map(([s, v]) => `<div class="hb"><span>${s}</span><div class="bar"><span style="width:${(v / slotMax) * 100}%"></span></div><b class="num">${v.toLocaleString()}</b></div>`).join('')}</div>
          </section>
          <section class="card">
            <h4>자주 먹은 음식</h4>
            ${topFoods.length ? `<ol class="rank">${topFoods.map(([n, f]) => `<li><span class="fn">${esc(n)}</span><span class="num">${f.n}번 · 평균 ${Math.round(f.k / f.n).toLocaleString()}kcal</span></li>`).join('')}</ol>` : '<p class="cap">아직 식단 기록이 없어요.</p>'}
          </section>
          <section class="card">
            <h4>칼로리가 높았던 음식</h4>
            ${heavy.length ? `<ol class="rank">${heavy.map((h) => `<li><span class="fn">${esc(h.name)} <small>${h.date.slice(5).replace('-', '/')}</small></span><span class="num">${h.kcal.toLocaleString()}kcal</span></li>`).join('')}</ol>` : '<p class="cap">아직 식단 기록이 없어요.</p>'}
          </section>
          <section class="card">
            <h4>루틴별 달성률</h4>
            ${rr.length ? `<div class="hbars">${rr.map(([r, p, n]) => `<div class="hb wide"><span>${esc(r.emoji)} ${esc(r.text)}</span><div class="bar"><span style="width:${p}%"></span></div><b class="num">${p}%</b></div>`).join('')}</div>` : '<p class="cap">루틴이 없어요.</p>'}
          </section>`;

        const cap = body.querySelector('#cap');
        body.querySelectorAll('.hit').forEach((h) => {
          const show = () => {
            const r = rows[Number(h.dataset.i)], pd = parse(r.date);
            body.querySelectorAll('.hit').forEach((x) => x.classList.toggle('on', x === h));
            cap.textContent = `${pd.getMonth() + 1}/${pd.getDate()} (${WD[pd.getDay()]}) · ${r.logged ? r.kcal.toLocaleString() + 'kcal' + (r.kcal > S.goalKcal ? ' · 목표 초과' : '') : '기록 없음'}${r.d.result === 'clear' ? ' · 클리어' : r.d.result === 'fail' ? ' · 실패' : ''}`;
          };
          h.addEventListener('mouseenter', show); h.addEventListener('click', show);
        });
      }
      draw();
    });
  }

  /* ---------- feedback ---------- */
  let toastT;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200);
  }
  function bump() { const p = $('#pointsBtn'); p.classList.remove('pump'); void p.offsetWidth; p.classList.add('pump'); }
  function celebrate() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('#fx'); c.hidden = false;
    const ctx = c.getContext('2d'); const dpr = devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cols = ['#5fd38d', '#ffcf5a', '#eef2ef', '#7cc4ff', '#ff9fb2'];
    const ps = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 3, s: 4 + Math.random() * 5, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6 }));
    let f = 0;
    (function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach((p) => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (++f < 110) requestAnimationFrame(tick); else { c.hidden = true; }
    })();
  }

  /* ---------- boot ---------- */
  if (settle()) persist();
  render();
  connect();
  // roll over at midnight while the app stays open
  let lastDay = today();
  setInterval(() => { const t = today(); if (t !== lastDay) { if (sel === lastDay) sel = t; lastDay = t; if (settle()) persist(); render(); } }, 60000);
})();
</script>

</body>
</html>
