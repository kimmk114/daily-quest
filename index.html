<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121517">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>하루 퀘스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — points header, week strip, quest card, tabbed lists, floating add button */
:root {
  --bg: #121517;
  --surface: #1c2023;
  --surface-2: #252a2e;
  --line: #2f363b;
  --fg: #eef2ef;
  --muted: #8d9893;
  --accent: #5fd38d;
  --accent-ink: #0d2416;
  --gold: #ffcf5a;
  --danger: #ff7070;
  --font-display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 120px;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; }
.brand small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.wallet { display: flex; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-family: var(--font-display); font-size: 17px;
}
.pill.points { color: var(--gold); }
.pill .coin { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); color: #4a3500; font-size: 11px; display: grid; place-items: center; font-family: var(--font-body); font-weight: 700; }
.pump { animation: pump .5s ease; }
@keyframes pump { 40% { transform: scale(1.18); } }

/* week strip */
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head .month { font-family: var(--font-display); font-size: 19px; display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 8px; }
.cal-head .month::after { content: "▾"; font-size: 13px; color: var(--muted); }
.cal-nav { display: flex; gap: 4px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 18px; }
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dayc { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px; border-radius: 14px; }
.dayc .dw { font-size: 11px; color: var(--muted); }
.dayc .dn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 16px; background: var(--surface); border: 2px solid transparent;
}
.dayc .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.dayc.today .dn { border-color: var(--muted); }
.dayc.sel .dn { background: var(--fg); color: var(--bg); }
.dayc.clear .dn { background: var(--accent); color: var(--accent-ink); }
.dayc.clear.sel .dn { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.dayc.fail .dot { background: var(--danger); }
.dayc.sun .dw { color: var(--danger); }

/* quest card */
.quest {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.quest.done { border-color: var(--accent); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface) 70%); }
.quest.failed { border-color: color-mix(in srgb, var(--danger) 60%, var(--line)); }
.quest-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.quest-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.reward { font-size: 12px; color: var(--muted); }
.reward b { color: var(--gold); font-weight: 600; }
.reward i { color: var(--danger); font-style: normal; font-weight: 600; }
.qrow { display: grid; grid-template-columns: 22px 54px 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
.qrow .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; }
.qrow.ok .ck { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.bar.over span { background: var(--danger); }
.qrow .val { color: var(--muted); min-width: 64px; text-align: right; }
.banner { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: var(--muted); }
.banner.win { color: var(--accent); font-weight: 600; }
.banner.lose { color: var(--danger); font-weight: 600; }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 14px; padding: 4px; }
.tab { padding: 10px 0; border-radius: 10px; font-family: var(--font-display); font-size: 17px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface-2); color: var(--fg); }
.tab .cnt { font-family: var(--font-body); font-size: 12px; margin-left: 4px; color: var(--muted); }

.panel { display: flex; flex-direction: column; gap: 10px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.link { color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 2px; }

/* routine rows (inspired by grid look) */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { display: grid; grid-template-columns: 74px 1fr auto; align-items: stretch; min-height: 58px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .when { display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.row .what { display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; min-width: 0; }
.row .what .em { font-size: 20px; flex: none; }
.row .what .tx { min-width: 0; overflow-wrap: anywhere; }
.row.done .what .tx { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); }
.row .side { display: flex; align-items: center; gap: 4px; padding-right: 10px; }
.check {
  width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center;
  color: transparent; font-weight: 700; transition: background .15s, border-color .15s;
}
.row.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.del { width: 30px; height: 30px; border-radius: 8px; color: var(--danger); font-size: 16px; }
.row.todo { grid-template-columns: 1fr auto; }
.row.todo .what { padding-left: 14px; }
.readonly .check { cursor: default; }

.empty { text-align: center; color: var(--muted); padding: 28px 16px; border: 1px dashed var(--line); border-radius: 16px; font-size: 14px; }
.empty b { display: block; color: var(--fg); font-family: var(--font-display); font-weight: 400; font-size: 17px; margin-bottom: 4px; }

/* meals */
.kcal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.kcal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.kcal-top .big { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.kcal-top .big small { font-size: 15px; color: var(--muted); margin-left: 4px; }
.kcal .bar { height: 12px; }
.kcal-note { font-size: 12px; color: var(--muted); }
.kcal-note.over { color: var(--danger); }
.slot { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.slot-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.slot-h .nm { font-family: var(--font-display); font-size: 16px; display: flex; align-items: center; gap: 6px; }
.slot-h .nm .req { font-family: var(--font-body); font-size: 11px; color: var(--muted); }
.slot-h .nm .ok { color: var(--accent); font-size: 13px; }
.slot-h .sum { font-size: 13px; color: var(--muted); }
.food { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.food .fn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.food .fk { color: var(--muted); font-size: 13px; }
.slot-add { width: 100%; padding: 10px 14px; text-align: left; color: var(--accent); font-size: 13px; font-weight: 600; border-top: 1px solid var(--line); }

/* FAB */
.fab {
  position: fixed; z-index: 20;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  font-size: 32px; line-height: 1; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.45);
}
.fab[hidden] { display: none !important; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow: auto;
  background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: up .22s ease;
}
.sheet-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 4px; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
  color: var(--fg); font: inherit; font-size: 16px;
}
.frow { display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip {
  padding: 8px 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 13px;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip span { color: var(--muted); margin-left: 4px; }
.primary { width: 100%; padding: 14px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; }
.ghost { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--line); color: var(--muted); }
.ghost.danger { color: var(--danger); }
.err { color: var(--danger); font-size: 13px; min-height: 1em; }

/* month calendar */
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.mgrid .wh { font-size: 11px; color: var(--muted); padding: 4px 0; }
.mcell { aspect-ratio: 1; max-width: 100%; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--font-display); font-size: 15px; background: var(--bg); }
.mcell.out { visibility: hidden; }
.mcell.clear { background: var(--accent); color: var(--accent-ink); }
.mcell.fail { background: color-mix(in srgb, var(--danger) 22%, var(--bg)); color: var(--danger); }
.mcell.today { outline: 2px solid var(--muted); outline-offset: -2px; }
.mcell small { font-family: var(--font-body); font-size: 9px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.hist { display: flex; flex-direction: column; }
.hist div { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist .p { color: var(--accent); font-weight: 600; }
.hist .m { color: var(--danger); font-weight: 600; }
.rules { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 12px; padding: 12px 14px; line-height: 1.7; }
.rules b { color: var(--fg); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center; animation: up .2s ease;
}
.sync { font-size: 11px; color: var(--muted); text-align: center; }
canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .row { grid-template-columns: 62px 1fr auto; } .qrow { grid-template-columns: 22px 46px 1fr auto; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">하루 퀘스트<small id="greet">오늘도 한 칸씩</small></div>
    <div class="wallet">
      <button class="pill" id="streakBtn" aria-label="연속 클리어">🔥 <span class="num" id="streak">0</span></button>
      <button class="pill points" id="pointsBtn" aria-label="포인트 내역"><span class="coin">P</span><span class="num" id="points">0</span></button>
    </div>
  </header>

  <section aria-label="캘린더">
    <div class="cal-head">
      <button class="month" id="monthBtn"></button>
      <div class="cal-nav">
        <button class="icon-btn" id="prevW" aria-label="이전 주">‹</button>
        <button class="icon-btn" id="todayBtn" aria-label="오늘로" style="font-size:13px;width:auto;padding:0 10px">오늘</button>
        <button class="icon-btn" id="nextW" aria-label="다음 주">›</button>
      </div>
    </div>
    <div class="week" id="week"></div>
  </section>

  <section class="quest" id="quest"></section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="routine" id="tab-routine">루틴<span class="cnt" id="c-routine"></span></button>
    <button class="tab" role="tab" data-tab="todo" id="tab-todo">투두<span class="cnt" id="c-todo"></span></button>
    <button class="tab" role="tab" data-tab="meal" id="tab-meal">식단<span class="cnt" id="c-meal"></span></button>
  </div>

  <section class="panel" id="panel"></section>
  <p class="sync" id="sync">불러오는 중…</p>
</div>

<button class="fab" id="fab" aria-label="추가">+</button>
<div id="sheetRoot"></div>
<canvas id="fx" hidden></canvas>

<script>
(() => {
  const KEY = 'daily-quest-v1';
  const REWARD = 100, PENALTY = 50;
  const SLOTS = ['아침', '점심', '저녁'];
  const MEAL_SLOTS = ['아침', '점심', '저녁', '간식'];
  const TIMES = ['아침', '점심', '오후', '저녁', '자기 전'];
  const EMOJIS = ['💧','🧘','💊','📖','🏃','💪','🪥','🧴','🛏️','✍️','🥗','🚶','🧹','🎧','☀️','🌙'];
  const PRESETS = [
    ['밥 한 공기', 300], ['현미밥 한 공기', 280], ['계란 1개', 75], ['닭가슴살 100g', 165],
    ['바나나 1개', 90], ['사과 1개', 110], ['고구마 1개', 130], ['그릭요거트', 120],
    ['샐러드', 150], ['김치찌개', 450], ['된장찌개', 300], ['라면', 500],
    ['김밥 한 줄', 420], ['샌드위치', 380], ['아메리카노', 10], ['라떼', 190], ['우유 한 잔', 130], ['프로틴 쉐이크', 140]
  ];
  const WD = ['일','월','화','수','목','금','토'];

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const today = () => ymd(new Date());

  function defaultState() {
    return {
      v: 1, points: 0, goalKcal: 2500, goalV2: true, startDate: today(), updatedAt: 0,
      routines: [
        { id: uid(), emoji: '💧', text: '일어나서 물 한 잔', time: '아침' },
        { id: uid(), emoji: '🧘', text: '스트레칭 10분', time: '아침' },
        { id: uid(), emoji: '💊', text: '영양제 챙겨 먹기', time: '점심' },
        { id: uid(), emoji: '📖', text: '독서 20분', time: '자기 전' }
      ],
      days: {}
    };
  }

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 1) S = defaultState();
  // 기존 기본값(1800)을 성인 남성 권장량(2500)으로 바꿈
  function migrate(s) { if (!s.goalV2) { if (s.goalKcal === 1800) s.goalKcal = 2500; s.goalV2 = true; } return s; }
  migrate(S);

  let sel = today();
  let tab = 'routine';
  let editRoutines = false;

  const emptyDay = () => ({ todos: [], rdone: {}, meals: [], result: null, delta: 0 });
  const getDay = (date) => S.days[date] || emptyDay();
  const ensureDay = (date) => (S.days[date] ||= emptyDay());

  function status(date) {
    const d = getDay(date);
    const rTotal = S.routines.length;
    const rDone = S.routines.filter((r) => d.rdone[r.id]).length;
    const tTotal = d.todos.length;
    const tDone = d.todos.filter((t) => t.done).length;
    const kcal = d.meals.reduce((a, m) => a + (Number(m.kcal) || 0), 0);
    const slotsDone = SLOTS.filter((s) => d.meals.some((m) => m.slot === s)).length;
    const rOK = rDone === rTotal;
    const tOK = tDone === tTotal;
    const mOK = slotsDone === SLOTS.length && kcal <= S.goalKcal;
    return { rTotal, rDone, tTotal, tDone, kcal, slotsDone, rOK, tOK, mOK, ok: rOK && tOK && mOK };
  }

  function applyDelta(n) { const before = S.points; S.points = Math.max(0, S.points + n); return S.points - before; }

  function settle() {
    const t = today();
    let changed = false;
    for (let date = S.startDate; date < t; date = addDays(date, 1)) {
      const d = getDay(date);
      if (d.result) continue;
      const st = status(date);
      const day = ensureDay(date);
      if (st.ok) { day.result = 'clear'; day.delta = applyDelta(REWARD); }
      else { day.result = 'fail'; day.delta = applyDelta(-PENALTY); }
      changed = true;
    }
    return changed;
  }

  function checkToday(date) {
    if (date !== today()) return;
    const st = status(date);
    const d = ensureDay(date);
    if (st.ok && d.result !== 'clear') {
      d.result = 'clear'; d.delta = applyDelta(REWARD);
      celebrate(); toast(`퀘스트 클리어! +${REWARD}P`); bump();
    } else if (!st.ok && d.result === 'clear') {
      applyDelta(-d.delta); d.result = null; d.delta = 0;
      toast('클리어 조건이 깨져서 포인트를 되돌렸어요'); bump();
    }
  }

  function streak() {
    let n = 0, date = today();
    if (getDay(date).result !== 'clear') date = addDays(date, -1);
    while (getDay(date).result === 'clear') { n++; date = addDays(date, -1); }
    return n;
  }

  /* ---------- persistence ---------- */
  let dbRef = null, saveTimer = null, saving = Promise.resolve();
  function setSync(t) { $('#sync').textContent = t; }
  function persist() {
    S.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (!dbRef) return;
      const snap = JSON.parse(JSON.stringify(S));
      saving = saving.then(() => dbRef.set(snap)).then(() => setSync('☁ 내 계정에 저장됨'))
        .catch(() => setSync('계정 저장에 실패했어요. 이 기기에는 저장돼 있어요.'));
    }, 700);
  }
  function commit(date) { if (date) checkToday(date); persist(); render(); }

  async function connect() {
    let tries = 0;
    while (!(window.claude && window.claude.use) && tries < 15) { await new Promise((r) => setTimeout(r, 200)); tries++; }
    if (!(window.claude && window.claude.use)) { setSync('이 기기(브라우저)에 저장 중'); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { setSync('로그인하면 계정에 저장돼요 · 지금은 이 기기에 저장 중'); return; }
    const ref = db.doc('data/users/' + id + '/state');
    const slow = setTimeout(() => setSync('계정 데이터를 아직 못 불러왔어요 · 이 기기 기록을 보여주는 중'), 10000);
    try {
      const snap = await ref.get();
      clearTimeout(slow);
      dbRef = ref;
      const remote = snap.exists ? snap.data() : null;
      if (remote && remote.v === 1 && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
        S = migrate(JSON.parse(JSON.stringify(remote)));
        if (settle()) persist();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        render();
        setSync('☁ 내 계정에 저장됨');
      } else {
        persist();
        setSync('☁ 내 계정에 저장됨');
      }
    } catch (e) {
      clearTimeout(slow);
      setSync('계정에 연결하지 못했어요 · 이 기기에 저장 중');
    }
  }

  /* ---------- rendering ---------- */
  function render() {
    const t = today();
    const st = status(sel);
    const d = getDay(sel);
    const isPast = sel < t, isFuture = sel > t;

    $('#points').textContent = S.points.toLocaleString();
    $('#streak').textContent = streak();
    const h = new Date().getHours();
    $('#greet').textContent = h < 11 ? '좋은 아침, 오늘도 한 칸씩' : h < 18 ? '오후도 퀘스트 진행 중' : '오늘 마무리할 시간';

    // week strip
    const sd = parse(sel);
    $('#monthBtn').textContent = `${sd.getFullYear()}년 ${sd.getMonth() + 1}월`;
    const start = addDays(sel, -sd.getDay());
    let wk = '';
    for (let i = 0; i < 7; i++) {
      const date = addDays(start, i);
      const r = getDay(date).result;
      const cls = ['dayc', date === t && 'today', date === sel && 'sel', r === 'clear' && 'clear', r === 'fail' && 'fail', i === 0 && 'sun'].filter(Boolean).join(' ');
      wk += `<button class="${cls}" data-date="${date}" aria-label="${date}"><span class="dw">${WD[i]}</span><span class="dn num">${parse(date).getDate()}</span><span class="dot"></span></button>`;
    }
    $('#week').innerHTML = wk;

    // quest card
    const q = $('#quest');
    q.className = 'quest' + (d.result === 'clear' ? ' done' : d.result === 'fail' ? ' failed' : '');
    const pct = (a, b) => (b === 0 ? 100 : Math.round((a / b) * 100));
    const kPct = Math.min(100, Math.round((st.kcal / S.goalKcal) * 100));
    const label = sel === t ? '오늘의 퀘스트' : `${sd.getMonth() + 1}월 ${sd.getDate()}일 퀘스트`;
    let banner = '';
    if (d.result === 'clear') banner = `<div class="banner win">🎉 퀘스트 클리어! +${d.delta}P 받았어요</div>`;
    else if (d.result === 'fail') banner = `<div class="banner lose">퀘스트 실패 · ${d.delta}P</div>`;
    else if (isFuture) banner = `<div class="banner">미리 할 일과 식단을 적어둘 수 있어요. 그날이 되면 퀘스트가 시작돼요.</div>`;
    q.innerHTML = `
      <div class="quest-head"><h2>${label}</h2><span class="reward">클리어 <b>+${REWARD}P</b> · 실패 <i>−${PENALTY}P</i></span></div>
      <div class="qrow ${st.rOK ? 'ok' : ''}"><span class="ck">${st.rOK ? '✓' : ''}</span><span>루틴</span><div class="bar"><span style="width:${pct(st.rDone, st.rTotal)}%"></span></div><span class="val num">${st.rDone}/${st.rTotal}</span></div>
      <div class="qrow ${st.tOK ? 'ok' : ''}"><span class="ck">${st.tOK ? '✓' : ''}</span><span>투두</span><div class="bar"><span style="width:${pct(st.tDone, st.tTotal)}%"></span></div><span class="val num">${st.tDone}/${st.tTotal}</span></div>
      <div class="qrow ${st.mOK ? 'ok' : ''}"><span class="ck">${st.mOK ? '✓' : ''}</span><span>식단</span><div class="bar ${st.kcal > S.goalKcal ? 'over' : ''}"><span style="width:${Math.max(pct(st.slotsDone, 3) * 0.999, 0)}%"></span></div><span class="val num">${st.slotsDone}/3끼</span></div>
      ${banner}`;

    // tabs
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    $('#c-routine').textContent = `${st.rDone}/${st.rTotal}`;
    $('#c-todo').textContent = `${st.tDone}/${st.tTotal}`;
    $('#c-meal').textContent = `${st.kcal.toLocaleString()}`;

    const ro = isPast; // past days are locked
    const p = $('#panel');
    const lockNote = ro ? `<div class="banner">지난 날은 기록만 볼 수 있어요.</div>` : '';
    if (tab === 'routine') {
      const order = (r) => TIMES.indexOf(r.time);
      const rs = [...S.routines].sort((a, b) => order(a) - order(b));
      const canCheck = !isFuture && !ro;
      p.innerHTML = `
        <div class="panel-head"><span>매일 반복되는 루틴</span><button class="link" id="editR">${editRoutines ? '완료' : '편집'}</button></div>
        ${lockNote}
        ${rs.length ? `<div class="list ${canCheck ? '' : 'readonly'}">${rs.map((r) => {
          const done = !!d.rdone[r.id];
          return `<div class="row ${done ? 'done' : ''}">
            <div class="when">${esc(r.time)}</div>
            <button class="what" data-act="${canCheck ? 'toggleR' : ''}" data-id="${r.id}"><span class="em">${esc(r.emoji)}</span><span class="tx">${esc(r.text)}</span></button>
            <div class="side">${editRoutines ? `<button class="del" data-act="delR" data-id="${r.id}" aria-label="삭제">✕</button>` : `<button class="check" data-act="${canCheck ? 'toggleR' : ''}" data-id="${r.id}" aria-label="완료 표시">✓</button>`}</div>
          </div>`;
        }).join('')}</div>` : `<div class="empty"><b>루틴이 비어 있어요</b>아래 + 버튼으로 매일 할 습관을 추가하세요.</div>`}
        ${isFuture ? '<div class="banner">루틴 체크는 그날 당일에 할 수 있어요.</div>' : ''}`;
    } else if (tab === 'todo') {
      p.innerHTML = `
        <div class="panel-head"><span>${sel === t ? '오늘' : `${sd.getMonth() + 1}/${sd.getDate()}`} 할 일</span></div>
        ${lockNote}
        ${d.todos.length ? `<div class="list ${ro ? 'readonly' : ''}">${d.todos.map((x) => `
          <div class="row todo ${x.done ? 'done' : ''}">
            <button class="what" data-act="${ro ? '' : 'toggleT'}" data-id="${x.id}"><span class="tx">${esc(x.text)}</span></button>
            <div class="side">${ro ? '' : `<button class="del" data-act="delT" data-id="${x.id}" aria-label="삭제">✕</button>`}<button class="check" data-act="${ro ? '' : 'toggleT'}" data-id="${x.id}" aria-label="완료 표시">✓</button></div>
          </div>`).join('')}</div>` : `<div class="empty"><b>할 일이 없어요</b>${ro ? '이날은 할 일이 없었어요.' : '+ 버튼으로 이날 할 일을 추가하세요. 할 일이 없으면 투두는 자동 통과예요.'}</div>`}`;
    } else {
      const over = st.kcal > S.goalKcal;
      p.innerHTML = `
        ${lockNote}
        <div class="kcal">
          <div class="kcal-top"><div class="big num">${st.kcal.toLocaleString()}<small>/ ${S.goalKcal.toLocaleString()} kcal</small></div>${ro ? '' : '<button class="link" id="goalBtn">목표 바꾸기</button>'}</div>
          <div class="bar ${over ? 'over' : ''}"><span style="width:${kPct}%"></span></div>
          <div class="kcal-note ${over ? 'over' : ''}">${over ? `목표보다 ${(st.kcal - S.goalKcal).toLocaleString()}kcal 더 먹었어요 · 식단 퀘스트 실패 조건이에요` : `${(S.goalKcal - st.kcal).toLocaleString()}kcal 남았어요 · 아침·점심·저녁을 기록하고 목표 안으로 먹으면 식단 퀘스트 완료`}</div>
        </div>
        ${MEAL_SLOTS.map((slot) => {
          const items = d.meals.filter((m) => m.slot === slot);
          const sum = items.reduce((a, m) => a + (Number(m.kcal) || 0), 0);
          const req = slot !== '간식';
          return `<div class="slot">
            <div class="slot-h"><span class="nm">${slot}${req ? (items.length ? '<span class="ok">✓</span>' : '<span class="req">필수</span>') : '<span class="req">선택</span>'}</span><span class="sum num">${sum.toLocaleString()} kcal</span></div>
            ${items.map((m) => `<div class="food"><span class="fn">${esc(m.name)}</span><span class="fk num">${Number(m.kcal).toLocaleString()} kcal</span>${ro ? '' : `<button class="del" data-act="delM" data-id="${m.id}" aria-label="삭제">✕</button>`}</div>`).join('')}
            ${ro ? '' : `<button class="slot-add" data-act="addM" data-slot="${slot}">+ ${slot} 기록하기</button>`}
          </div>`;
        }).join('')}`;
    }

    $('#fab').hidden = ro || (tab === 'meal');
  }

  /* ---------- interactions ---------- */
  document.addEventListener('click', (e) => {
    const dayBtn = e.target.closest('.dayc');
    if (dayBtn) { sel = dayBtn.dataset.date; render(); return; }
    const a = e.target.closest('[data-act]');
    if (!a || !a.dataset.act) return;
    const id = a.dataset.id;
    const act = a.dataset.act;
    if (act === 'toggleR') { const d = ensureDay(sel); d.rdone[id] = !d.rdone[id]; commit(sel); }
    else if (act === 'delR') { S.routines = S.routines.filter((r) => r.id !== id); commit(sel); }
    else if (act === 'toggleT') { const x = ensureDay(sel).todos.find((t) => t.id === id); if (x) x.done = !x.done; commit(sel); }
    else if (act === 'delT') { const d = ensureDay(sel); d.todos = d.todos.filter((t) => t.id !== id); commit(sel); }
    else if (act === 'delM') { const d = ensureDay(sel); d.meals = d.meals.filter((m) => m.id !== id); commit(sel); }
    else if (act === 'addM') openMeal(a.dataset.slot);
  });
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; editRoutines = false; render(); }));
  $('#panel').addEventListener('click', (e) => {
    if (e.target.id === 'editR') { editRoutines = !editRoutines; render(); }
    if (e.target.id === 'goalBtn') openGoal();
  });
  $('#prevW').onclick = () => { sel = addDays(sel, -7); render(); };
  $('#nextW').onclick = () => { sel = addDays(sel, 7); render(); };
  $('#todayBtn').onclick = () => { sel = today(); render(); };
  $('#monthBtn').onclick = () => openMonth(parse(sel));
  $('#pointsBtn').onclick = openHistory;
  $('#streakBtn').onclick = openHistory;
  $('#fab').onclick = () => (tab === 'routine' ? openRoutine() : openTodo());

  /* ---------- sheets ---------- */
  function openSheet(html, onMount) {
    const root = $('#sheetRoot');
    root.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div>${html}</div></div>`;
    root.querySelector('[data-close]').onclick = closeSheet;
    root.querySelectorAll('[data-dismiss]').forEach((b) => (b.onclick = closeSheet));
    onMount && onMount(root);
    const f = root.querySelector('input:not([type=hidden])');
    if (f) setTimeout(() => f.focus(), 60);
  }
  function closeSheet() { $('#sheetRoot').innerHTML = ''; }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  function segHTML(name, opts, cur) {
    return `<div class="seg" data-seg="${name}">${opts.map((o) => `<button type="button" aria-pressed="${o === cur}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  function wireSeg(root, name, cb) {
    const box = root.querySelector(`[data-seg="${name}"]`);
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      box.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      cb(b.dataset.v);
    });
  }

  function openRoutine() {
    let time = '아침', emoji = '💧';
    openSheet(`
      <h3>루틴 추가</h3>
      <form id="f" class="sheet-in" style="gap:14px">
        <div class="field"><label>언제</label>${segHTML('time', TIMES, time)}</div>
        <div class="field"><label>아이콘</label>${segHTML('emoji', EMOJIS, emoji)}</div>
        <div class="field"><label for="rtext">무엇을</label><input id="rtext" maxlength="40" placeholder="예: 선크림 꼭 바르기" autocomplete="off"></div>
        <div class="err" id="ferr"></div>
        <button class="primary">추가하기</button>
        <button type="button" class="ghost" data-dismiss>취소</button>
      </form>`, (root) => {
      wireSeg(root, 'time', (v) => (time = v));
      wireSeg(root, 'emoji', (v) => (emoji = v));
      root.querySelector('#f').onsubmit = (e) => {
        e.preventDefault();
        const text = root.querySelector('#rtext').value.trim();
        if (!text) { root.querySelector('#ferr').textContent = '루틴 이름을 적어주세요.'; return; }
        S.routines.push({ id: uid(), emoji, text, time });
        closeSheet(); commit(sel <= today() ? sel : null); toast('루틴을 추가했어요');
      };
    });
  }

  function openTodo() {
    openSheet(`
      <h3>할 일 추가 <span style="font-family:var(--font-body);font-size:13px;color:var(--muted)">${parse(sel).getMonth() + 1}/${parse(sel).getDate()}</span></h3>
      <form id="f" class="sheet-in" style="gap:14px">
        <div class="field"><label for="ttext">할 일</label><input id="ttext" maxlength="60" placeholder="예: 은행 다녀오기" autocomplete="off"></div>
        <div class="err" id="ferr"></div>
        <button class="primary">추가하기</button>
        <button type="button" class="ghost" data-dismiss>닫기</button>
      </form>`, (root) => {
      root.querySelector('#f').onsubmit = (e) => {
        e.preventDefault();
        const inp = root.querySelector('#ttext');
        const text = inp.value.trim();
        if (!text) { root.querySelector('#ferr').textContent = '할 일을 적어주세요.'; return; }
        ensureDay(sel).todos.push({ id: uid(), text, done: false });
        commit(sel);
        inp.value = ''; inp.focus();
        root.querySelector('#ferr').textContent = '';
        toast('추가했어요 · 계속 입력할 수 있어요');
      };
    });
  }

  function openMeal(slot) {
    openSheet(`
      <h3>${esc(slot)} 기록</h3>
      <form id="f" class="sheet-in" style="gap:14px">
        <div class="field"><label>끼니</label>${segHTML('slot', MEAL_SLOTS, slot)}</div>
        <div class="field"><label>자주 먹는 음식 (누르면 바로 입력)</label>
          <div class="chips">${PRESETS.map(([n, k]) => `<button type="button" class="chip" data-n="${esc(n)}" data-k="${k}">${esc(n)}<span>${k}</span></button>`).join('')}</div>
        </div>
        <div class="frow">
          <div class="field"><label for="mk">칼로리</label><input id="mk" type="number" inputmode="numeric" min="0" max="5000" placeholder="kcal"></div>
          <div class="field"><label for="mn">음식</label><input id="mn" maxlength="40" placeholder="예: 닭가슴살 샐러드" autocomplete="off"></div>
        </div>
        <div class="err" id="ferr"></div>
        <button class="primary">기록하기</button>
        <button type="button" class="ghost" data-dismiss>취소</button>
      </form>`, (root) => {
      wireSeg(root, 'slot', (v) => (slot = v));
      root.querySelector('.chips').addEventListener('click', (e) => {
        const c = e.target.closest('.chip'); if (!c) return;
        root.querySelector('#mn').value = c.dataset.n;
        root.querySelector('#mk').value = c.dataset.k;
      });
      root.querySelector('#f').onsubmit = (e) => {
        e.preventDefault();
        const name = root.querySelector('#mn').value.trim();
        const kcal = Math.round(Number(root.querySelector('#mk').value));
        if (!name) { root.querySelector('#ferr').textContent = '음식 이름을 적어주세요.'; return; }
        if (!Number.isFinite(kcal) || kcal < 0 || root.querySelector('#mk').value === '') { root.querySelector('#ferr').textContent = '칼로리를 숫자로 적어주세요. 모르면 0도 괜찮아요.'; return; }
        ensureDay(sel).meals.push({ id: uid(), slot, name, kcal });
        closeSheet(); commit(sel); toast(`${slot}에 ${kcal}kcal 기록했어요`);
      };
    });
  }

  function openGoal() {
    openSheet(`
      <h3>하루 목표 칼로리</h3>
      <form id="f" class="sheet-in" style="gap:14px">
        <div class="rules">성인 남성 하루 권장 칼로리는 약 <b>2,500kcal</b>예요 (19~29세 2,600 · 30~49세 2,500 · 50~64세 2,200 · 보건복지부 2020 한국인 영양소 섭취기준). 다이어트 중이면 여기서 300~500kcal 정도 빼서 정하는 경우가 많아요.</div>
        <div class="field"><label for="gk">kcal</label><input id="gk" type="number" inputmode="numeric" min="800" max="5000" value="${S.goalKcal}"></div>
        <div class="chips">${[2000, 2200, 2500, 2600, 2800, 3000].map((k) => `<button type="button" class="chip" data-k="${k}">${k}</button>`).join('')}</div>
        <div class="err" id="ferr"></div>
        <button class="primary">저장</button>
        <button type="button" class="ghost" data-dismiss>취소</button>
      </form>`, (root) => {
      root.querySelector('.chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) root.querySelector('#gk').value = c.dataset.k; });
      root.querySelector('#f').onsubmit = (e) => {
        e.preventDefault();
        const k = Math.round(Number(root.querySelector('#gk').value));
        if (!(k >= 800 && k <= 5000)) { root.querySelector('#ferr').textContent = '800에서 5000 사이로 적어주세요.'; return; }
        S.goalKcal = k; closeSheet(); commit(today()); toast(`목표를 ${k}kcal로 바꿨어요`);
      };
    });
  }

  function openMonth(base) {
    let y = base.getFullYear(), m = base.getMonth();
    const draw = (root) => {
      const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
      const t = today();
      let cells = WD.map((w) => `<div class="wh">${w}</div>`).join('');
      for (let i = 0; i < first.getDay(); i++) cells += `<div class="mcell out"></div>`;
      let clear = 0, fail = 0;
      for (let dd = 1; dd <= days; dd++) {
        const date = ymd(new Date(y, m, dd));
        const r = getDay(date).result;
        if (r === 'clear') clear++; if (r === 'fail') fail++;
        const kc = getDay(date).meals.reduce((a, x) => a + (Number(x.kcal) || 0), 0);
        cells += `<button class="mcell ${r || ''} ${date === t ? 'today' : ''}" data-go="${date}"><span class="num">${dd}</span>${kc ? `<small class="num">${kc}</small>` : ''}</button>`;
      }
      root.querySelector('#mtitle').textContent = `${y}년 ${m + 1}월`;
      root.querySelector('#mg').innerHTML = cells;
      root.querySelector('#msum').textContent = `클리어 ${clear}일 · 실패 ${fail}일`;
    };
    openSheet(`
      <div class="cal-head"><h3 id="mtitle"></h3><div class="cal-nav"><button class="icon-btn" id="mp" aria-label="이전 달">‹</button><button class="icon-btn" id="mn2" aria-label="다음 달">›</button></div></div>
      <div class="mgrid" id="mg"></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>클리어</span><span><i style="background:color-mix(in srgb,var(--danger) 40%,var(--bg))"></i>실패</span><span>숫자 아래 = 먹은 kcal</span><span id="msum"></span></div>
      <button class="ghost" data-dismiss>닫기</button>`, (root) => {
      draw(root);
      root.querySelector('#mp').onclick = () => { m--; if (m < 0) { m = 11; y--; } draw(root); };
      root.querySelector('#mn2').onclick = () => { m++; if (m > 11) { m = 0; y++; } draw(root); };
      root.querySelector('#mg').addEventListener('click', (e) => { const c = e.target.closest('[data-go]'); if (c) { sel = c.dataset.go; closeSheet(); render(); } });
    });
  }

  function openHistory() {
    const rows = Object.entries(S.days).filter(([, d]) => d.result).sort((a, b) => (a[0] < b[0] ? 1 : -1)).slice(0, 30);
    openSheet(`
      <h3>포인트 <span class="num" style="color:var(--gold)">${S.points.toLocaleString()}P</span></h3>
      <div class="rules"><b>규칙</b><br>· 루틴 전부 + 투두 전부 + 아침·점심·저녁 기록하고 목표 칼로리 이하 → <b>+${REWARD}P</b><br>· 하루가 지났는데 하나라도 못 하면 → <b>−${PENALTY}P</b> (0P 아래로는 안 내려가요)<br>· 🔥 숫자는 연속으로 클리어한 날이에요 · 지금 ${streak()}일</div>
      <div class="hist">${rows.length ? rows.map(([date, d]) => `<div><span>${date.slice(5).replace('-', '/')} ${d.result === 'clear' ? '클리어' : '실패'}</span><span class="${d.delta >= 0 ? 'p' : 'm'} num">${d.delta >= 0 ? '+' : ''}${d.delta}P</span></div>`).join('') : '<div><span style="color:var(--muted)">아직 내역이 없어요. 오늘 퀘스트를 깨보세요!</span></div>'}</div>
      <button class="ghost" data-dismiss>닫기</button>`);
  }

  /* ---------- feedback ---------- */
  let toastT;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200);
  }
  function bump() { const p = $('#pointsBtn'); p.classList.remove('pump'); void p.offsetWidth; p.classList.add('pump'); }
  function celebrate() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('#fx'); c.hidden = false;
    const ctx = c.getContext('2d'); const dpr = devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cols = ['#5fd38d', '#ffcf5a', '#eef2ef', '#7cc4ff', '#ff9fb2'];
    const ps = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 3, s: 4 + Math.random() * 5, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6 }));
    let f = 0;
    (function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach((p) => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (++f < 110) requestAnimationFrame(tick); else { c.hidden = true; }
    })();
  }

  /* ---------- boot ---------- */
  if (settle()) persist();
  render();
  connect();
  // roll over at midnight while the app stays open
  let lastDay = today();
  setInterval(() => { const t = today(); if (t !== lastDay) { if (sel === lastDay) sel = t; lastDay = t; if (settle()) persist(); render(); } }, 60000);
})();
</script>

</body>
